<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Animations</title>
        <link rel="stylesheet" href="./styles/transitions.css?v=1" />
        <style>
            :root {
                --bg-color: navy;
            }
            body {
                font-family: sans-serif;

                min-height: 100%;
                background: var(--bg-color, black);
                color: contrast-color(var(--bg-color));
            }
            transition-controlls {
                display: grid;
                position: absolute;
                inset: 50%;

                transform: translate(-50%, -50%);
                width: 40vmin;
                height: 40vmin;
                gap: 0px;
                background: var(--bg-color);
                overflow: hidden;
                border-shape: circle(closest-side);
                border: 4px solid oklch(from var(--bg-color) 0.85 c h / 0.3);
                grid-template-columns: repeat(6, 1fr);

                select {
                    grid-area: 2/2;
                }

                select,
                ::picker(select) {
                    appearance: base-select;
                }

                button {
                    --_bg: oklch(from var(--bg-color) calc(l - 0.1) c h);

                    background-color: var(--_bg);
                    border: 2px solid white;
                    border-shape: inset(-5px round 5px);
                    color: contrast-color(var(--_bg));
                }

                [data-axis="inline"] {
                    grid-area: 2/3;
                }

                [data-axis="inline"][data-reverse] {
                    grid-area: 2/1;
                }

                [data-axis="block"] {
                    grid-area: 3/2;
                }

                [data-axis="block"][data-reverse] {
                    grid-area: 1/2/2/4;
                }
            }

            @view-transition {
                animation-duration: 12s;
            }
        </style>
    </head>
    <body>
        <h1>flip</h1>

        <transition-controlls>
            <select id="transiton" name="transition-type">
                <option value="move">move-in</option>
                <option value="flip">flip</option>
                <option value="push">push</option>
                <option value="wipe">wipe</option>
                <option value="blend">blend</option>
                <option value="circle" selected>circle</option>
            </select>

            <button data-axis="inline">inline</button>
            <button data-axis="inline" data-reverse>inline reverse</button>
            <button data-axis="block">block</button>
            <button data-axis="block" data-reverse>block reverse</button>
        </transition-controlls>
        <script>
            const headline = document.querySelector("h1");

            const selectElement = document.querySelector("select");
            let counter = 1;

            document.addEventListener("click", handleClick);

            function handleClick(e) {
                if (!e.target.closest("button")) return;

                let { axis = inline, reverse } =
                    e.target.closest("button").dataset;
                let transitionName = selectElement.value;

                if (!document.startViewTransition) {
                    updateTheDOMSomehow();
                    return;
                }

                reverse = reverse === undefined ? "" : "reverse";

                document.startViewTransition({
                    update: updateTheDOMSomehow,
                    types: [transitionName, axis, reverse],
                });
            }

            function updateTheDOMSomehow() {
                const myColor = `oklch(50% 50% ${Math.random() * 360}deg)`;

                document.documentElement.style.setProperty(
                    "--bg-color",
                    myColor,
                );

                headline.textContent = counter++;
            }
        </script>
    </body>
</html>
