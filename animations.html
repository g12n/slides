<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Animations</title>

        <link rel="stylesheet" href="./styles/transitions.css" />

        <style>
            :root {
                --x-axis: 1;
                --y-axis: 0;
                --axis: y;
                --max-duration: 1s;
            }
            body {
                font-family: sans-serif;
                margin: 0;
                display: grid;
                gap: 1rem;
                padding: 1rem;
                grid-template-columns: repeat(
                    auto-fill,
                    minmax(min(100%, 350px), 1fr)
                );
                overflow-x: hidden;
            }
            animation-demo {
                aspect-ratio: 16/9;

                place-items: center;
                container-type: inline-size;
                background-color: var(--bg, deeppink);
                color: white;
                position: relative;
                overflow: clip;
            }
            animation-demo::before {
                background-color: var(--bg, pink);
                color: deeppink;
                display: grid;
                place-items: center;
                position: absolute;
                inset: 0;
                animation-name: attr(data-animation-name);
                animation-duration: 2s;
                animation-iteration-count: infinite;
                animation-direction: alternate;
                font-size: clamp(1rem, 7cqi, 8rem);
                content: attr(data-animation-name);
            }

            h2 {
                grid-column: 1/-1;
            }
            @view-transition {
                animation-duration: 12s;
            }
        </style>
    </head>
    <body>
        <h2>Animations Preview</h2>
        <animation-demo data-animation-name="push-in"></animation-demo>
        <animation-demo data-animation-name="push-out"></animation-demo>
        <animation-demo data-animation-name="flip-in"></animation-demo>
        <animation-demo data-animation-name="flip-out"></animation-demo>
        <animation-demo data-animation-name="step-back"></animation-demo>
        <animation-demo data-animation-name="circle"></animation-demo>
        <animation-demo data-animation-name="wipe"></animation-demo>
        <animation-demo data-animation-name="blend-in"></animation-demo>
        <animation-demo data-animation-name="blend-in"></animation-demo>
    </body>
</html>
